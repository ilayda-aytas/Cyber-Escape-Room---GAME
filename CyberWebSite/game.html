<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Breach Lab - Game</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        #unity-canvas {
            width: 100% !important;
            height: 100% !important;
            background: #000;
        }

        /* DURAKLATMA (PAUSE) OVERLAY */
        #pause-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 5, 13, 0.88);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            font-family: monospace;
        }

        #pause-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .pause-box {
            border: 2px solid #ffcc00;
            background: rgba(15, 23, 42, 0.95);
            padding: 30px 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.3);
        }

        .pause-box h2 {
            color: #ffcc00;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .pause-box p {
            color: #94a3b8;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"> </div>

        <!-- DURAKLATMA EKRANI -->
        <div id="pause-overlay">
            <div class="pause-box">
                <h2>⏸️ OYUN DURDURULDU</h2>
                <p>Devam etmek için yukarıdaki "Devam Et" butonuna tıklayın.</p>
            </div>
        </div>
    </div>

    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var pauseOverlay = document.querySelector("#pause-overlay");
        var unityInstance = null;

        var buildUrl = "Build";
        
        //  Brotli (.br) uzantılı dosya yapısına uygun konfigürasyon
        var config = {
            dataUrl: buildUrl + "/WebBuild.data.br",
            frameworkUrl: buildUrl + "/WebBuild.framework.js.br",
            codeUrl: buildUrl + "/WebBuild.wasm.br",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "CyberLab",
            productName: "Breach Lab",
            productVersion: "1.0",
        };

        var script = document.createElement("script");
        script.src = buildUrl + "/WebBuild.loader.js";
        
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = (100 * progress) + "%";
            }).then((instance) => {
                unityInstance = instance;
                loadingBar.style.display = "none";
            }).catch((message) => {
                console.error("Unity yükleme hatası:", message);
            });
        };

        document.body.appendChild(script);

        // INDEX.HTML ÜZERİNDEN GELEN PAUSE/RESUME SİNYALİ
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'TOGGLE_PAUSE') {
                if (event.data.paused) {
                    pauseOverlay.classList.add('active');
                    if (unityInstance) unityInstance.SendMessage('GameManager', 'PauseGame');
                } else {
                    pauseOverlay.classList.remove('active');
                    if (unityInstance) unityInstance.SendMessage('GameManager', 'ResumeGame');
                }
            }
        });
    </script>
</body>
</html>
